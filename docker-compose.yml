version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mobifin_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mobifin
    ports:
      - "5432:5432"
    volumes:
      - mobifin_postgres_data:/var/lib/postgresql/data

volumes:
  mobifin_postgres_data:
    driver: local
